<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eaf5ff" />
    <title>目前沒有網路連線</title>
    <style>
      :root { color-scheme: light; --ink: #202936; --muted: #69717c; --page: #eaf5ff; --surface: rgba(255,255,255,.86); --line: #d9dce1; --brand: #111a62; --danger: #b82e28; --danger-soft: #ffe8e5; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body { margin: 0; min-height: 100dvh; overflow: hidden; color: var(--ink); background: radial-gradient(circle at 68% 8%,#fff 0 7%,transparent 7.2%),radial-gradient(circle at 84% 13%,#fff 0 10%,transparent 10.2%),radial-gradient(circle at 96% 17%,#fff 0 9%,transparent 9.2%),var(--page); font-family: "PingFang TC","Noto Sans TC","Microsoft JhengHei",ui-sans-serif,system-ui,sans-serif; }
      button { font: inherit; }
      .scene { position: fixed; pointer-events: none; user-select: none; inset: 0; z-index: 0; background: radial-gradient(circle at 31% 25%,rgba(255,255,255,.9) 0 6%,transparent 6.2%),radial-gradient(circle at 40% 29%,rgba(255,255,255,.9) 0 8%,transparent 8.2%); }
      .shell { position: relative; z-index: 3; display: grid; grid-template-columns: minmax(15rem,19.75rem) minmax(0,1fr); gap: 1.5rem; width: min(100% - 3rem,85.5rem); height: calc(100dvh - 3rem); margin: 1.5rem auto; }
      .sidebar,.content { border: 1px solid rgba(205,209,216,.8); border-radius: 1.25rem; background: var(--surface); backdrop-filter: blur(8px); }
      .sidebar { display: flex; min-height: 0; flex-direction: column; padding: 2rem 1.5rem 1.5rem; }
      .brand { margin: 0 0 2rem; text-align: center; font-size: 1rem; font-weight: 700; letter-spacing: .02em; }
      .search { display: flex; align-items: center; gap: .75rem; min-height: 3rem; padding: 0 1rem; border: 1px solid var(--line); border-radius: .875rem; background: rgba(255,255,255,.72); color: var(--muted); }
      .nav { display: grid; gap: 1.5rem; margin-top: 1.75rem; padding: 0 1rem; color: var(--muted); }
      .nav-item { display: flex; align-items: center; gap: .75rem; font-size: .95rem; font-weight: 600; }
      .publish-placeholder { display: flex; align-items: center; justify-content: center; gap: .75rem; min-height: 4.25rem; margin-top: auto; border-radius: 999px; background: var(--brand); color: #fff; font-weight: 700; opacity: .42; }
      .content { display: grid; min-width: 0; place-items: center; padding: 2rem; }
      .offline-state { display: flex; width: min(100%,31rem); flex-direction: column; align-items: center; text-align: center; }
      .offline-icon { display: grid; width: 4.25rem; height: 4.25rem; place-items: center; border-radius: 999px; background: var(--danger-soft); color: var(--danger); }
      .offline-icon svg { width: 2rem; height: 2rem; }
      h1 { margin: 1.25rem 0 0; font-size: clamp(1.25rem,1.7vw,1.5rem); line-height: 1.4; }
      .message { margin: .75rem 0 0; color: var(--muted); font-size: .95rem; line-height: 1.7; }
      .retry { min-height: 2.75rem; margin-top: 1.5rem; padding: 0 1.5rem; cursor: pointer; border: 0; border-radius: 999px; background: var(--brand); color: #fff; font-weight: 700; transition: transform 120ms ease,opacity 120ms ease; }
      .retry:hover { opacity: .9; } .retry:active { transform: translateY(1px); } .retry:focus-visible { outline: 3px solid rgba(17,26,98,.28); outline-offset: 3px; }
      .mobile-header { display: none; }
      .icon-stroke { width: 1.25rem; height: 1.25rem; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      @media (max-width: 767px), (max-width: 1023px) and (orientation: portrait) {
        body { overflow-y: auto; background: radial-gradient(circle at 68% 5%,#fff 0 9%,transparent 9.2%),radial-gradient(circle at 85% 8%,#fff 0 11%,transparent 11.2%),var(--page); }
        .scene { background: radial-gradient(circle at -8% 52%,rgba(255,255,255,.78) 0 10%,transparent 10.2%),radial-gradient(circle at 8% 56%,rgba(255,255,255,.78) 0 10%,transparent 10.2%); }
        .shell { display: block; width: 100%; height: auto; min-height: 100dvh; margin: 0; padding: 1.5rem 1.25rem; }
        .sidebar { display: none; } .mobile-header { display: grid; gap: 1.5rem; }
        .mobile-brand { display: flex; align-items: center; gap: 1.25rem; min-height: 2.75rem; font-size: 1.1rem; font-weight: 700; }
        .menu-lines { display: grid; width: 1.5rem; gap: .32rem; } .menu-lines span { height: 2px; border-radius: 2px; background: currentColor; }
        .mobile-header .search { min-height: 3.9rem; border-radius: 1rem; background: rgba(255,255,255,.88); font-size: 1rem; }
        .content { display: block; margin-top: 1.25rem; padding: 0; border: 0; background: transparent; backdrop-filter: none; }
        .offline-state { min-height: 22.5rem; justify-content: center; padding: 2.25rem 1.5rem; border-radius: 1.75rem; background: rgba(255,255,255,.82); }
        .offline-icon { width: 5.25rem; height: 5.25rem; } .offline-icon svg { width: 2.4rem; height: 2.4rem; }
        h1 { margin-top: 1.35rem; font-size: 1.45rem; } .message { max-width: 20rem; font-size: 1rem; } .retry { margin-top: 1.25rem; }
      }
      @media (max-height: 720px) and (max-width: 767px) {
        .offline-state { min-height: 18rem; }
      }
      @media (prefers-reduced-motion: reduce) { .retry { transition: none; } }
    </style>
  </head>
  <body>
    <div class="scene" aria-hidden="true"></div>
    <main class="shell">
      <aside class="sidebar" aria-hidden="true">
        <p class="brand">曼陀號技能交換平台</p>
        <div class="search"><svg class="icon-stroke" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg><span>關鍵字搜尋…</span></div>
        <div class="nav">
          <div class="nav-item"><svg class="icon-stroke" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 8h18c0-1-3-1-3-8"></path><path d="M10 20h4"></path></svg><span>系統通知</span></div>
          <div class="nav-item"><svg class="icon-stroke" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg><span>設定中心</span></div>
        </div>
        <div class="publish-placeholder">我要發文 <span aria-hidden="true">＋</span></div>
      </aside>
      <section class="mobile-header" aria-hidden="true">
        <div class="mobile-brand"><span class="menu-lines"><span></span><span></span><span></span></span><span>曼陀號技能交換平台</span></div>
        <div class="search"><svg class="icon-stroke" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg><span>關鍵字搜尋…</span></div>
      </section>
      <section class="content">
        <div class="offline-state" role="alert">
          <div class="offline-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M5 12.5a13 13 0 0 1 4-2.6M9.5 8.3A16 16 0 0 1 19 10.5M12.5 15.8a5 5 0 0 1 2.7 1.4M12 19h.01"></path></svg></div>
          <h1>目前沒有網路連線</h1>
          <p class="message">請確認你的網路狀態，連線恢復後再重新整理。</p>
          <button class="retry" type="button" onclick="location.reload()">重新整理</button>
        </div>
      </section>
    </main>
    <script>window.addEventListener("online", () => location.reload());</script>
  </body>
</html>
